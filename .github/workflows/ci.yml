name: CI

# 词典库和写作模型都不在仓库里（各 103 / 123 MiB）。测试套件对此有准备：
# 依赖它们的用例走 Skip 而不是失败，所以新克隆的仓库上 CI 是绿的。
# 出安装包的那条线在 release.yml，那里才会去取词典库。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只测实际会发布的两个平台。macOS 这一档主要是盯着别写进
        # Windows-only 的东西——SpeechService 里就有一段 SAPI COM。
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: 还原
        run: dotnet restore

      - name: 构建
        run: dotnet build -c Release --no-restore --nologo

      - name: 测试
        run: dotnet test -c Release --no-build --nologo
