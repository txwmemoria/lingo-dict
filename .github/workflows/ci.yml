name: CI

# 词典库和写作模型都不在仓库里（各 103 / 123 MiB）。测试套件对此有准备：
# 依赖它们的用例走 Skip 而不是失败，所以新克隆的仓库上 CI 是绿的。
# 出安装包的那条线在 release.yml，那里才会去取词典库。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 日常 push 只跑 Windows；PR 和手动触发才带上 macOS。
        #
        # 仓库是 private，runner 按分钟计费且倍率不同：Windows 2x、macOS 10x。
        # 实测一次 CI 是 Windows 3m42s（7 计费分钟）+ macOS 4m55s（49 分钟）——
        # macOS 占了 88%，2000 分钟的免费额度只够 35 次 push。
        #
        # 丢掉的覆盖有限：打 tag 时 release.yml 的 macOS job 同样会跑全量测试，
        # 所以发版之前一定过一遍。想在中途单独验证就手动触发这条 workflow。
        os: >-
          ${{ github.event_name == 'push'
              && fromJSON('["windows-latest"]')
              || fromJSON('["windows-latest", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: 还原
        run: dotnet restore

      - name: 构建
        run: dotnet build -c Release --no-restore --nologo

      - name: 测试
        run: dotnet test -c Release --no-build --nologo
